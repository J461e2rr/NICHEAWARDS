name: Deploy Niche Awards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy.yml']

permissions:
  contents: read

concurrency:
  group: niche-awards-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare voting API and Pages assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node scripts/prepare-pages.mjs
          npx --yes wrangler@4.165.0 d1 migrations apply DB --remote --config wrangler.pages.json
          npx --yes wrangler@4.165.0 deploy --config wrangler.pages.json
          node scripts/check-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

